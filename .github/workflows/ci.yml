name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taska
    env:
      DATABASE_URL: file:./dev.db
      AUTH_SECRET: ci-only-secret-not-used-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: taska/package-lock.json
      - run: npm ci
      - run: npx prisma db push --skip-generate
      - run: npm test
      - run: npm run build
